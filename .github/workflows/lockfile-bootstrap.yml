name: Temporary lockfile bootstrap

on:
  push:
    branches:
      - development/stage-4-realtime-foundation
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - ".github/workflows/lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: development/stage-4-realtime-foundation
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve complete workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "chore(deps): generate complete pnpm lockfile"
            git push
          fi
